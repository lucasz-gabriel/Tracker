<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

<!-- Céu estrelado da página Início -->
<div class="ceu-inicio" aria-hidden="true">

    <!-- Constelação 1: "W" (estilo Cassiopeia) -->
    <div class="cst cst-1">
        <span class="ln" style="left:0;top:10px;width:61px;transform:rotate(55deg)"></span>
        <span class="ln" style="left:35px;top:60px;width:46px;transform:rotate(-41deg)"></span>
        <span class="ln" style="left:70px;top:30px;width:53px;transform:rotate(49deg)"></span>
        <span class="ln" style="left:105px;top:70px;width:65px;transform:rotate(-57deg)"></span>
        <span class="st" style="left:0;top:10px">★</span>
        <span class="st" style="left:35px;top:60px;animation-delay:1s">✶</span>
        <span class="st" style="left:70px;top:30px;animation-delay:2s">★</span>
        <span class="st" style="left:105px;top:70px;animation-delay:3s">✷</span>
        <span class="st" style="left:140px;top:15px;animation-delay:.5s">★</span>
    </div>

    <!-- Constelação 2: cruz (estilo Cruzeiro do Sul) -->
    <div class="cst cst-2">
        <span class="ln" style="left:50px;top:0;width:90px;transform:rotate(3deg)"></span>
        <span class="ln" style="left:5px;top:40px;width:95px;transform:rotate(6deg)"></span>
        <span class="st" style="left:50px;top:0">✷</span>
        <span class="st" style="left:55px;top:90px;animation-delay:1.5s">★</span>
        <span class="st" style="left:5px;top:40px;animation-delay:2.5s">✶</span>
        <span class="st" style="left:100px;top:50px;animation-delay:.8s">★</span>
        <span class="st" style="left:80px;top:75px;animation-delay:3.2s;font-size:11px">⋆</span>
    </div>

    <!-- Constelação 3: "carrinho" (estilo Ursa Maior) -->
    <div class="cst cst-3">
        <span class="ln" style="left:0;top:10px;width:36px;transform:rotate(16deg)"></span>
        <span class="ln" style="left:35px;top:20px;width:38px;transform:rotate(23deg)"></span>
        <span class="ln" style="left:70px;top:35px;width:40px;transform:rotate(83deg)"></span>
        <span class="ln" style="left:75px;top:75px;width:45px;transform:rotate(6deg)"></span>
        <span class="ln" style="left:120px;top:80px;width:40px;transform:rotate(-97deg)"></span>
        <span class="ln" style="left:115px;top:40px;width:45px;transform:rotate(-174deg)"></span>
        <span class="st" style="left:0;top:10px">☆</span>
        <span class="st" style="left:35px;top:20px;animation-delay:1s">★</span>
        <span class="st" style="left:70px;top:35px;animation-delay:2s">✶</span>
        <span class="st" style="left:75px;top:75px;animation-delay:3s">★</span>
        <span class="st" style="left:120px;top:80px;animation-delay:.5s">✷</span>
        <span class="st" style="left:115px;top:40px;animation-delay:1.8s">★</span>
    </div>

    <!-- Estrelas soltas -->
    <span class="st solta" style="top:8%;left:22%">⋆</span>
    <span class="st solta" style="top:28%;left:58%;animation-delay:1.5s">✶</span>
    <span class="st solta" style="top:40%;left:12%;animation-delay:2.5s">·</span>
    <span class="st solta" style="top:64%;right:22%;animation-delay:.5s">✷</span>
    <span class="st solta" style="bottom:18%;left:48%;animation-delay:3.5s">⋆</span>
    <span class="st solta" style="top:20%;right:28%;animation-delay:4.5s">☆</span>
    <span class="st solta" style="bottom:6%;right:44%;animation-delay:2s">·</span>
</div>

<div class = "layout"> 
    <aside class="sidebar"> 
        <div class="logo">
            <svg class="lua" viewBox="0 0 100 100" role="img" aria-label="Tracker">
                <defs>
                    <mask id="recorte-lua">
                        <rect width="100" height="100" fill="white"/>
                        <circle cx="62" cy="40" r="32" fill="black"/>
                    </mask>
                </defs>
                <circle cx="48" cy="52" r="36" fill="currentColor" mask="url(#recorte-lua)"/>
            </svg>
            <span class="logo-nome">Tracker</span>
        </div>
            
        <nav>
            <a href="#inicio" class="active" >Início</a>
            <a href="previsao.html">Previsão</a>
            <a href="categorias.html">Categorias</a>
            <a href="sobre.html">Sobre mim</a>
        </nav>
    </aside>


    <main class="main-content">
        <section id="inicio">
            
            <div class="cards">
                <div class="card saldo-card">
                    <div class="saldo-header">
                        <span class="saldo-title">Saldo Disponível</span>
                    </div>
                    <div class="saldo-body">
                        <h2 class="saldo-value" id="saldo">R$ 1000,00</h2>
                    </div>
                </div>

                <div class="card entrada-resumo-card">
                    <div class="saldo-header">
                        <span class="saldo-title">Entradas</span>
                    </div>
                    <div class="saldo-body">
                        <h2 class="entrada-value" id="total-entradas">R$ 0,00</h2>
                    </div>
                </div>

                <div class="card saida-resumo-card">
                    <div class="saldo-header">
                        <span class="saldo-title">Saídas</span>
                    </div>
                    <div class="saldo-body">
                        <h2 class="saida-value" id="total-saidas">R$ 0,00</h2>
                    </div>
                </div>

                <div class="card previsao-card">
                    <div class="previsao-header">
                        <span class="previsao-title">Previsão de Saldo</span>
                    </div>
                    <div class="previsao-body">
                        <h2 class="previsao-value" id="previsao">R$ 1000,00</h2>
                    </div>
                </div>
            </div>

            <div class="lancamentos">
                <div class="card entrada-card">
                    <div class="entrada-header">
                        <span class="entrada-title">Nova entrada</span>
                    </div>
                    <div class="entrada-body">
                        <label for="descricao-entrada">O que é?</label>
                        <input type="text" id="descricao-entrada" placeholder="Ex: Salário, Venda, etc.">

                        <label for="valor-entrada">Quanto quer adicionar?   </label>
                        <input type="number" id="valor-entrada" placeholder="R$ 0,00">

                        <label for="categoria-entrada">Categoria</label>
                        <select id="categoria-entrada">
                            <option value="">Sem categoria</option>
                        </select>

                        <button class="entrada-button" id="btn-entrada">Adicionar</button>
                    </div>
            </div>

            <div class="card saida-card">
                    <div class="saida-header">
                        <span class="saida-title">Nova saída</span>
                    </div>
                    <div class="saida-body">
                        <label for="descricao-saida">O que é?</label>
                        <input type="text" id="descricao-saida" placeholder="Ex: Mercado, Serviço, etc.">

                        <label for="valor-saida">Quanto quer retirar?</label>
                        <input type="number" id="valor-saida" placeholder="R$ 0,00">

                        <label for="categoria-saida">Categoria</label>
                        <select id="categoria-saida">
                            <option value="">Sem categoria</option>
                        </select>

                        <button class="saida-button" id="btn-saida">Retirar</button>
                    </div>
                </div>
            </div>

            <div class="secao-grafico-assinaturas">
                <div class="grafico-card">
                    <canvas id="grafico-rosca" width="380" height="380"></canvas>
                </div>
                <div class="card assinaturas-card">
                    <div class="assinaturas-header">
                        <span class="assinaturas-title">Assinaturas</span>
                    </div>

                    <div class="assinaturas-body">
                        <div class="nova-assinatura">
                            <input type="text" id="nome-assinatura" placeholder="Nome (ex: Netflix)">
                            <input type="number" id="valor-assinatura" placeholder="R$ 0,00">
                            <input type="number" id="dia-assinatura" placeholder="Dia (1-31)" min="1" max="31">
                            <select id="categoria-assinatura">
                                    <option value="">Sem categoria</option>
                            </select>
                            <button id="btn-assinatura">+ Adicionar assinatura</button>
                        </div>
                    </div>
                </div>
            </div>

            
            <div class="listas-inferiores">

                <div class="transacoes">
                    <h3>Últimas transações</h3>
                    <ul id="lista-transacoes"></ul>
                </div>

                <div class="divisoria-listas"></div>

                <div class="assinaturas-lista">
                    <h3>Minhas assinaturas</h3>
                    <ul id="lista-assinaturas"></ul>
                    <section class="card-assinaturas">
                        <h2>Cobranças pendentes</h2>
                        <ul id="lista-cobrancas"></ul>
                    </section>
                </div>

            </div>

        </section>
    </main>
</div>

</body>
</html>
