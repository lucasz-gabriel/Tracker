<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="saldo-card"> 
        <div class="saldo-header">
            <span class="saldo-title">Saldo Disponível</span>
            <span class="saldo-icon">💰</span>
        </div>

        <div class="saldo-body">
            <h2 class="saldo-value">R$ 1000,00</h2>
        </div>
    </div>  

    <div class="entrada-card"> 
        <div class="entrada-header">
            <span class="entrada-title">Entradas</span>
            <span class="entrada-icon">➕</span>
        </div>
    

        <div class="entrada-body">
            <label for="valor-entrada">Digite quanto deseja adicionar</label>
            <input type="number" placeholder="R$ 0,00">
            <button class="entrada-button">Adicionar</button>
        </div>
    </div>  

    <div class="saida-card"> 
        <div class="saida-header">
            <span class="saida-title">Saídas</span>
            <span class="saida-icon">➖</span>
        </div>

        <div class="saida-body">
            <label for="valor-saida">Digite quanto deseja retirar</label>
            <input type="number" placeholder="R$ 0,00">
            <button class="saida-button">Retirar</button>
        </div>
    </div>  

    <div class="previsao-card"> 
        <div class="previsao-header">
            <span class="previsao-title">Previsão de Saldo</span>
            <span class="previsao-icon">📊</span>
        </div>

        <div class="previsao-body">
            <h2> Valor previsto </h2>
            <h2 class="previsao-value">R$ 1000,00</h2>
        </div>
    </div>  

</body>
</html>
